    <path d="M430 55 v90 h95 v55 h85"/>
  </g>
  <!-- reactor core -->
  <g transform="translate(415,455)">
    <circle cx="0" cy="0" r="95" fill="#6e685c"/>
    <circle cx="0" cy="0" r="78" fill="#59544a"/>
    <circle cx="0" cy="0" r="52" fill="#44403a"/>
