  <!-- top control panel -->
  <g transform="translate(320,40)">
    <rect width="180" height="46" rx="6" fill="#5d584e"/>
    <rect x="10" y="8" width="34" height="14" rx="2" fill="#3a3a3a"/>
    <rect x="52" y="8" width="34" height="14" rx="2" fill="#3a3a3a"/>
    <rect x="94" y="8" width="34" height="14" rx="2" fill="#3a3a3a"/>
    <rect x="136" y="8" width="34" height="14" rx="2" fill="#3a3a3a"/>
    <rect x="10" y="28" width="160" height="10" rx="2" fill="#46443e"/>
  </g>
  <!-- right consoles -->
  <g fill="#59544a">
    <rect x="640" y="250" width="120" height="52" rx="6"/>
    <rect x="648" y="258" width="46" height="18" rx="3" fill="#3a3a3a"/>
    <rect x="702" y="258" width="46" height="18" rx="3" fill="#3a3a3a"/>
    <rect x="640" y="380" width="130" height="56" rx="6" fill="#54504a"/>
    <rect x="650" y="390" width="52" height="20" rx="3" fill="#383838"/>
