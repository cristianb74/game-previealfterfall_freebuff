  </g>
  <text x="160" y="290" font-family="monospace" font-size="20" fill="#4f4a40" opacity="0.85">ZONA DE</text>
  <text x="160" y="312" font-family="monospace" font-size="20" fill="#4f4a40" opacity="0.85">CUARENTENA</text>
  <text x="130" y="560" font-family="monospace" font-size="28" fill="#4f4a40" opacity="0.8">NO</text>
  <text x="640" y="470" font-family="monospace" font-size="18" fill="#4f4a40" opacity="0.85">ACCESO</text>
  <text x="644" y="490" font-family="monospace" font-size="18" fill="#4f4a40" opacity="0.85">DENEGADO</text>
  <text x="600" y="592" font-family="monospace" font-size="15" fill="#4f4a40" opacity="0.7">ZONA DE PELIGRO</text>
  <g transform="translate(560,595)" opacity="0.8">
    <circle cx="0" cy="0" r="17" fill="none" stroke="#4f4a40" stroke-width="4"/>
    <path d="M-10 -10 L10 10 M10 -10 L-10 10" stroke="#4f4a40" stroke-width="4"/>
    <path d="M14 6 L30 20 L26 24 L10 10 Z" fill="#4f4a40"/>
