<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f8a7c"/><stop offset="1" stop-color="#6f6a5e"/>
    </linearGradient>
    <radialGradient id="pit" cx="0.5" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#1d1f20" stop-opacity="0.9"/><stop offset="1" stop-color="#1d1f20" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#floor)"/>
  <ellipse cx="410" cy="190" rx="220" ry="120" fill="url(#pit)"/>
  <path d="M320 45 L355 110 L330 175 L375 240 L345 305" stroke="#3c3a33" stroke-width="7" fill="none" opacity="0.6"/>
  <!-- pipes -->
  <g stroke="#7a4a30" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M360 60 v70 h-90 v60 h-80"/>
    <path d="M430 55 v90 h95 v55 h85"/>
    <path d="M395 150 v80 h-110 v70"/>
    <path d="M395 230 v60 h130 v70 h80"/>
  </g>
  <g stroke="#5d3a26" stroke-width="5" fill="none" opacity="0.8">
