    <rect x="36" y="272" width="66" height="40" rx="6" fill="#4e565e"/>
    <rect x="60" y="252" width="60" height="36" rx="6" fill="#5d6368" transform="rotate(-14 90 270)"/>
    <rect x="30" y="316" width="70" height="34" rx="6" fill="#6a7076" transform="rotate(8 65 333)"/>
    <rect x="118" y="300" width="46" height="30" rx="5" fill="#57606a" transform="rotate(18 141 315)"/>
    <circle cx="70" cy="300" r="20" fill="none" stroke="#8a5a3a" stroke-width="7"/>
    <path d="M150 360 l26 -10 l20 12 l-10 16 l-28 2 z" fill="#6a5638"/>
